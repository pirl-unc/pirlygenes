name: Tests
on:
  # A PR branch push also emits pull_request:synchronize. Running both events
  # launched two identical test matrices for every review update.
  pull_request:
  # Retain a post-merge gate for the deployed branch.
  push:
    branches: [main]

jobs:
  current-openvax-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve the current OpenVax packages together
        run: |
          python -m pip install --upgrade pip uv
          # Pin current consumers so a conflicting owner pin cannot select an
          # older application. Shared dependencies follow those consumers'
          # declared bounds, including intentional major-version exclusions.
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen

          requirements = [
              ".[test,viz]", "varcode", "pyensembl", "datacache", "gtfparse",
              "serializable", "mhcflurry", "mhcgnomes", "mhctools", "pepdata",
              "orfdata", "tsarina",
          ]
          for spec in (
              "vaxrank[hitlist,cta]", "topiary[weirdo]", "hitlist", "isovar",
              "pirl-trufflepig",
          ):
              project = spec.split("[", 1)[0]
              with urlopen(f"https://pypi.org/pypi/{project}/json", timeout=30) as response:
                  version = json.load(response)["info"]["version"]
              requirements.append(f"{spec}=={version}")
          path = Path(os.environ["RUNNER_TEMP"]) / "current-openvax.txt"
          path.write_text("\n".join(requirements) + "\n")
          print(path.read_text())
          PY
          uv pip install --system --upgrade --torch-backend cpu --index-url https://pypi.org/simple \
            -r "$RUNNER_TEMP/current-openvax.txt"
          python -m pip check
          python -m pip freeze
      - name: Exercise owner compatibility and installed-bundle reuse
        env:
          PIRLYGENES_NO_ENSEMBL_INSTALL: "1"
        run: >-
          python -m pytest -n 0 -q tests/test_oncoref_adoption.py
          tests/test_cta_peptide_adoption.py tests/test_cta_compatibility.py
          tests/test_load_dataset_and_gene_sets.py::test_cta_evidence_preserves_owner_hpa_and_tsarina_ms

  release-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release versions against current main
        run: |
          git fetch origin main --tags
          python scripts/release_versions.py --base-ref origin/main

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create virtual environment and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv venv
          source .venv/bin/activate
          # Keep lint policy reproducible. Ruff enables and changes rules across
          # releases, so an unbounded install can fail unchanged code.
          uv pip install coveralls pylint 'ruff==0.15.9'
          # Revalidate owner and cache dependencies after an upstream release; stale
          # index metadata can otherwise report a just-published version missing.
          uv pip install --refresh-package oncoref --refresh-package datacache '.[test]'
      - name: Cache pyensembl data
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyensembl/
          key: pyensembl-81-111-112-${{ runner.os }}
      - name: Cache NCBI gene-data mirror
        # Build-time Entrez tables (Homo_sapiens.gene_info.gz + gene_history.gz)
        # pulled from the pinned GitHub release. Keyed on the module that pins
        # GENE_DATA_MIRROR_TAG so bumping the tag invalidates the cache.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pirlygenes/ncbi_gene_info/
          key: ncbi-gene-data-${{ runner.os }}-${{ hashFiles('pirlygenes/builders/ncbi_gene_info.py') }}
      - name: Cache pirlygenes data bundle
        # Pirlygenes-owned derived views and HPA/pan-cancer matrices from the
        # version-pinned release. Keyed on version.py (DATA_VERSION) so a data
        # release re-fetches; otherwise reused across CI runs.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pirlygenes/bundled_data/
          key: pirlygenes-bundle-${{ runner.os }}-${{ hashFiles('pirlygenes/version.py') }}
      - name: Resolve oncoref cache version
        id: oncoref-cache-version
        run: |
          source .venv/bin/activate
          python -c "import oncoref; from oncoref.version import DATA_VERSION; print(f'key={oncoref.__version__}-data-{DATA_VERSION}')" >> "$GITHUB_OUTPUT"
      - name: Cache oncoref data bundle
        # oncoref owns the delegated cancer-reference-expression summary rows
        # (#557). Cache its version-derived parquet shards as well as the source
        # bundle so each matrix job does not reparse the multi-million-row CSV.
        # Key on the resolved package and data versions because Actions cache
        # entries are immutable.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/oncoref/bundled_data/
            ~/.cache/oncoref/shard_cache/
          key: oncoref-bundle-${{ runner.os }}-${{ steps.oncoref-cache-version.outputs.key }}
      - name: Cache source-data mirror
        # Raw per-source inputs (small/medium: GEO, CLL-map) mirrored to a
        # pinned release for FTP-independent builds. Keyed on the mirror module.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pirlygenes/source_data/
          key: pirlygenes-source-data-${{ runner.os }}-${{ hashFiles('pirlygenes/builders/source_data_mirror.py') }}
      - name: Install Ensembl genome data
        run: |
          source .venv/bin/activate
          # Three releases: 112 (current) for modern IDs; 81 (2015) because the
          # cancer-reference-expression aggregate pools source cohorts annotated
          # at that vintage — ~4.6k of its ENSG IDs were retired from Ensembl
          # after release 81, so release 112 alone fails test_gene_ids at 8.7%
          # (81 + 112 covers all but 0.8%, under tolerance); and 111 — the
          # gene-family generator's default baseline release, so its
          # release-dependent tests run here instead of skipping. Cached so this
          # is a one-time cost (see the pyensembl cache key above).
          echo "Before installing Ensembl releases 81 + 111 + 112" && df -h
          pyensembl install --release 112 --species homo_sapiens
          pyensembl install --release 111 --species homo_sapiens
          pyensembl install --release 81 --species homo_sapiens
          echo "After installing Ensembl releases 81 + 111 + 112" && df -h
          # Fail fast if any release isn't usable — the gene-resolution /
          # gene-family tests depend on them and would otherwise silently *skip*
          # (a green CI run that never actually exercised them).
          python -c "from pyensembl import EnsemblRelease; assert EnsemblRelease(112).genes_by_name('TP53'); assert EnsemblRelease(111).genes_by_name('TP53'); assert EnsemblRelease(81).genes_by_name('TP53'); print('Ensembl releases 81 + 111 + 112 ready')"
      - name: Run linting script and unit tests
        run: |
          source .venv/bin/activate
          # Every Python version runs the full suite. Coverage instruments that
          # same suite once: repeating it in all four matrix jobs adds substantial
          # CPU time without measuring additional lines.
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            COVERAGE=1 ./test.sh
          else
            ./test.sh
          fi
      - name: Recheck release versions after the full test suite
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --tags
          python scripts/release_versions.py --base-ref origin/main
