version: 2
updates:
  # Pirlygenes pins its oncoref data owner exactly because downloadable
  # compatibility artifacts record the package and data versions that built
  # them. Check that pin daily so a new owner release produces a visible PR
  # instead of silently blocking downstream dependency resolution (#601).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    allow:
      - dependency-name: oncoref
    open-pull-requests-limit: 1
    commit-message:
      prefix: deps
