[project]
name = "pirlygenes"
requires-python = ">=3.11"
authors = [ {name="Alex Rubinsteyn", email="alex.rubinsteyn@unc.edu" } ]
description = "Curated cancer gene sets and reference expression data. Analysis lives in `trufflepig`."
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Programming Language :: Python :: Implementation :: CPython",
    'Environment :: Console',
    'Operating System :: OS Independent',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: Apache Software License',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
]
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "datacache>=1.34.0",
    "matplotlib>=3.7.0",
    "numpy>=2.0.0",
    # oncoref owns the cancer-type ontology, source/sample registries, and
    # delegated expression/normalization mechanics. Upper bound pins releases
    # validated with the current materialized cohort matrices (#665/#667).
    "oncoref>=1.23.1,<=1.49.0",
    "openpyxl>=3.1.0",
    "pandas>=3,<4",
    # Parquet engine for the cohort-matrix / representative / percentile
    # artifacts (pd.read_parquet). Present transitively today via
    # pyensembl→gtfparse, but declared directly since pirlygenes reads parquet
    # in several modules and must not break if that chain changes (#474 review).
    "pyarrow>=10",
    # Context-managed annotation access closes partition reference resources.
    "pyensembl>=2.32.3",
    "PyYAML>=6.0",
    "tqdm",
    # Oncoref owns the historical panel/HPA evidence. Tsarina 1.36 defaults to
    # the current research selection; consume only its independent ms_* evidence
    # and derive historical partitions consistently here (#664). No local
    # membership snapshot or copied biological decision rules are introduced.
    "tsarina>=1.36.0",
]

[tool.setuptools.dynamic]
version = {attr = "pirlygenes.version.__version__"}

[tool.setuptools.packages.find]
include = ["pirlygenes*"]

# Disable VCS auto-discovery of files. Without this, setuptools defaults
# to include_package_data=True when git is detected, which auto-ships
# every git-tracked file and IGNORES the package-data positive list
# below — that's how the 5.3.0 wheel ballooned to 331 MB before we
# caught it. Forcing False makes the package-data list authoritative.
[tool.setuptools]
include-package-data = false

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pypdf>=5",  # verify vector output text
    "reportlab>=4",  # exercise PDF compilation in the standard test environment
]
# Optional plotting extras. matplotlib is a core dep; matplotlib_venn is only
# needed for the CTA source-overlap venn (pirlygenes plot cta-curation), which
# is supplied by the pinned oncoref plotting implementation.
viz = [
    "matplotlib_venn>=1.0",
    "pypdf>=5",
    "reportlab>=4",
]
[project.urls]
"Homepage" = "https://github.com/pirl-unc/pirlygenes"
"Bug Tracker" = "https://github.com/pirl-unc/pirlygenes"

# Shim that prints a "moved to trufflepig" message and exits 2. Keeps
# `pirlygenes` on PATH from breaking with `command not found` for users
# whose CI/batch jobs still invoke the old analyze CLI. See pirlygenes/cli.py.
[project.scripts]
pirlygenes = "pirlygenes.cli:main"

[build-system]
# setuptools-scm was removed in v5.3.0 because it was auto-including
# every git-tracked file in the wheel, which overrode our explicit
# exclude-package-data rules and pushed the wheel past PyPI's 100 MiB
# limit. Version comes from pirlygenes/version.py via the
# [tool.setuptools.dynamic] attr lookup, so scm isn't needed.
requires = ["setuptools>=60"]

[tool.setuptools.package-data]
# Only small curated panels ship in the wheel. Empirical rows, source metadata,
# sample manifests, and per-sample matrices are owned/fetched by oncoref
# (#557/#528); pirlygenes' remaining precomputed matrices, pan-cancer matrix, and
# HPA cell-type matrix come from its versioned data bundle.
# See pirlygenes/data_bundle.py.
pirlygenes = [
    "data/*.csv",            # small curated panels (cancer-key-genes, CTAs, etc.)
    "data/*.csv.gz",         # small generated artifacts
]

# What we deliberately DO NOT ship in the wheel:
#   data/cohort-expression-matrices/*            precomputed matrices
#   data/pan-cancer-expression.csv                       ~11 MB
#   data/hpa-cell-type-expression.csv                    ~7 MB
# (The last three paths are fetched by pirlygenes.data_bundle. Per-cohort
# summary rows, source matrices/manifests, medoid representatives, and
# percentile vectors are fetched by oncoref.)
[tool.setuptools.exclude-package-data]
pirlygenes = [
    "data/cohort-expression-matrices/*",
    "data/pan-cancer-expression.csv",
    "data/hpa-cell-type-expression.csv",
]

[tool.pytest.ini_options]
# Keep the repository default serial. The full suite materializes large
# reference frames in-process, so xdist workers multiply peak memory. The root
# conftest also forces automatic worker counts to zero and requires an explicit,
# two-worker-max opt-in for a known-lightweight subset.
markers = [
    "perf: performance-regression fences",
]
